[project]
name = "custom-shirt-studio-module08-admin-backend"
version = "0.3.0"
description = "Custom Shirt Studio — Module 08 Small Business Admin Dashboard Backend (Phase 03 Auth, RBAC & Audit Core)"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 108
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S105", "S106"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
